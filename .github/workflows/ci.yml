name: CI

# Tests and clippy on every push and pull request, in the Arch Linux container the release
# builds use, and the tests again on Windows (the .exe's file and update handling). The
# tests that need a real save get the sealed copy app/assets/test-save.tar.xz.gpg and the
# game-asset pack (the UI test picks equipment by name); see app/assets/README.md. Without
# the secret (a fork's pull request) the editor builds with placeholders and those tests
# stay #[ignore]d. The one that downloads a release never runs here.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Toolchain
        run: |
          # a font: the headless UI test lays out text (fontconfig finds none otherwise)
          pacman -Syu --noconfirm --needed git rustup fontconfig ttf-dejavu python gettext
          rustup default stable
          rustup component add clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # the translation template matches the source and every catalog is valid
      - name: Translations
        run: python3 tools/i18n.py --check

      - name: Asset pack and test save
        env:
          ASSETS_PASSPHRASE: ${{ secrets.ASSETS_PASSPHRASE }}
        run: &unseal |
          if [ -z "$ASSETS_PASSPHRASE" ]; then
            echo "::warning::no ASSETS_PASSPHRASE: the tests that need a real save are skipped"
            exit 0
          fi
          printf '%s' "$ASSETS_PASSPHRASE" |
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt app/assets/gen.tar.gz.gpg |
            tar -xz -C app/assets
          test -f app/assets/gen/names.json
          # Git Bash on Windows: its tar needs /d/a/... and the tests D:/a/...
          dir="$RUNNER_TEMP/save"
          if command -v cygpath > /dev/null; then dir=$(cygpath -u "$dir"); fi
          mkdir -p "$dir"
          printf '%s' "$ASSETS_PASSPHRASE" |
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt app/assets/test-save.tar.xz.gpg |
            tar -xJ -C "$dir"
          if command -v cygpath > /dev/null; then dir=$(cygpath -m "$dir"); fi
          echo "MHGU_TEST_SAVE=$dir/0/system" >> "$GITHUB_ENV"

      - name: Tests
        working-directory: app
        run: &test |
          if [ -n "$MHGU_TEST_SAVE" ]; then
            cargo test --workspace -- --include-ignored --skip installs_a_published_release
          else
            cargo test --workspace
          fi

      - name: Clippy
        working-directory: app
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - name: Toolchain
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/checkout@v7

      # a cold MSVC build takes ~20 min: keep the cache of a failed run too
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          cache-on-failure: true

      - name: Asset pack and test save
        env:
          ASSETS_PASSPHRASE: ${{ secrets.ASSETS_PASSPHRASE }}
        run: *unseal

      - name: Tests
        working-directory: app
        run: *test
