[workspace]
members = ["core", "gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Public domain like the rest of the repo. Slint is used under its Royalty-free 2.0
# licence, which requires the AboutSlint widget in the About dialog.
license = "Unlicense"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
