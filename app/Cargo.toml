[workspace]
members = ["core", "gui"]
resolver = "3"

[workspace.package]
version = "3.6.0"
edition = "2024"
# GPL v3 or later like the rest of the repo (LICENSE). Slint is used under its
# Royalty-free 2.0 licence, which requires the AboutSlint widget in the About dialog.
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# No unwinding tables or landing pads. Nothing catches a panic outside the tests (which
# keep unwinding): one on the UI thread already ended the program; the update workers
# return their errors instead of panicking.
panic = "abort"

# Slint's Android backend with one addition: the application sees every touch before Slint
# dispatches it (gui/src/android/gesture.rs tells a list's scroll from a swipe there, which
# Slint cannot do without delaying one of them). vendor/README.md: what differs from
# upstream and how to redo it on a Slint upgrade.
[patch.crates-io]
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }
