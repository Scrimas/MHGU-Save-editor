[package]
name = "mhgu-editor"
description = "Monster Hunter Generations Ultimate save editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mhgu-save = { path = "../core" }
# Pinned: src/scroll.rs uses i-slint-core's internal wheel event, which must match.
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = "3"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
i-slint-core = "=1.18.1"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
